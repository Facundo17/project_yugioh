<!DOCTYPE html>
<html>
<head><title>YuGiOh Classifier</title></head>
<body>
  <h1>Clasificador de Cartas YuGiOh</h1>
  <form id="uploadForm">
    <input type="file" id="fileInput" accept="image/*" />
    <button type="submit">Clasificar</button>
  </form>
  <ul id="result"></ul>
  <p id="result"></p>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async e => {
      e.preventDefault();
      const file = document.getElementById("fileInput").files[0];
      const formData = new FormData();
      formData.append("file", file);
      const res = await fetch("http://localhost:8000/predict", {
        method: "POST",
        body: formData
      });
      const data = await res.json();

      let item = document.createElement('li');
      let text = document.createElement('p');

      text.innerText =  `Tipo: ${data.label} | Confianza: ${(data.confidence * 100).toFixed(2)}%`;

      item.appendChild(text);
      document.getElementById("result").appendChild(item);

      /*document.getElementById("result").innerText = 
        `Tipo: ${data.label} | Confianza: ${(data.confidence * 100).toFixed(2)}%`;*/
    });
  </script>
</body>
</html>
